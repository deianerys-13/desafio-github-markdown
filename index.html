<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo de Forca com Palavroo API</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      margin: 0;
    }
    
    .container {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-align: center;
      max-width: 500px;
    }
    
    h1 {
      color: #333;
      margin-bottom: 30px;
    }
    
    .palavra-display {
      font-size: 32px;
      font-weight: bold;
      letter-spacing: 10px;
      color: #667eea;
      margin: 20px 0;
      font-family: monospace;
    }
    
    .stats {
      display: flex;
      justify-content: space-around;
      margin: 20px 0;
      color: #666;
    }
    
    .stats-item {
      padding: 10px;
    }
    
    input[type="text"] {
      padding: 10px;
      font-size: 16px;
      width: 100%;
      max-width: 200px;
      border: 2px solid #667eea;
      border-radius: 5px;
      margin: 10px 0;
    }
    
    button {
      background: #667eea;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      margin: 10px;
    }
    
    button:hover {
      background: #764ba2;
    }
    
    .letras-erradas {
      margin: 20px 0;
      color: #e74c3c;
    }
    
    .letras-certas {
      margin: 10px 0;
      color: #27ae60;
    }
    
    .mensagem {
      font-size: 20px;
      font-weight: bold;
      margin: 20px 0;
    }
    
    .vitoria {
      color: #27ae60;
    }
    
    .derrota {
      color: #e74c3c;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎮 Jogo de Forca</h1>
    
    <div class="stats">
      <div class="stats-item">
        Tentativas: <strong id="tentativas">6</strong>
      </div>
      <div class="stats-item">
        Acertos: <strong id="acertos">0</strong>
      </div>
    </div>
    
    <div class="palavra-display" id="palavraDisplay">_ _ _ _ _ _</div>
    
    <div class="letras-certas" id="letrasCertas"></div>
    <div class="letras-erradas" id="letrasErradas"></div>
    
    <input type="text" id="letraInput" placeholder="Digite uma letra" maxlength="1">
    <button onclick="chutar()">Chutar</button>
    
    <div class="mensagem" id="mensagem"></div>
    
    <button onclick="novoJogo()" style="background: #27ae60;">Novo Jogo</button>
  </div>

  <!-- Importa as funções da API Palavroo -->
  <script src="api-palavroo.js"></script>

  <script>
    // Estado do jogo
    let jogo = {
      palavra: "",
      tentativas: 6,
      letrasErradas: [],
      letrasAcertadas: [],
      gameOver: false,
      venceu: false
    };
    
    // Iniciar novo jogo - chama função do api-palavroo.js
    async function novoJogo() {
      const palavra = await pegarPalavraAleatoria();
      jogo = {
        palavra: palavra,
        tentativas: 6,
        letrasErradas: [],
        letrasAcertadas: [],
        gameOver: false,
        venceu: false
      };
      atualizarDisplay();
      document.getElementById("letraInput").value = "";
      document.getElementById("mensagem").innerText = "";
    }
    
    // Atualizar display da palavra e estatísticas
    function atualizarDisplay() {
      let display = "";
      for (let letra of jogo.palavra) {
        if (jogo.letrasAcertadas.includes(letra)) {
          display += letra + " ";
        } else {
          display += "_ ";
        }
      }
      document.getElementById("palavraDisplay").innerText = display;
      document.getElementById("tentativas").innerText = jogo.tentativas;
      document.getElementById("acertos").innerText = jogo.letrasAcertadas.length;
      document.getElementById("letrasErradas").innerText = 
        jogo.letrasErradas.length > 0 ? "❌ Erradas: " + jogo.letrasErradas.join(", ") : "";
    }
    
    // Processar chute de letra
    function chutar() {
      const input = document.getElementById("letraInput").value.toUpperCase();
      
      // Validações
      if (!input) {
        alert("Digite uma letra!");
        return;
      }
      
      if (input.length !== 1) {
        alert("Digite apenas UMA letra!");
        return;
      }
      
      if (jogo.letrasAcertadas.includes(input) || jogo.letrasErradas.includes(input)) {
        alert("Você já tentou essa letra!");
        return;
      }
      
      if (jogo.gameOver) {
        alert("Jogo acabou! Clique em 'Novo Jogo'");
        return;
      }
      
      // Verificar se acertou a letra
      if (jogo.palavra.includes(input)) {
        jogo.letrasAcertadas.push(input);
        
        // Verificar se venceu (adivinhou todas as letras)
        if (jogo.palavra.split("").every(l => jogo.letrasAcertadas.includes(l))) {
          jogo.venceu = true;
          jogo.gameOver = true;
          document.getElementById("mensagem").innerText = "🎉 Você Venceu!";
          document.getElementById("mensagem").classList.add("vitoria");
        }
      } else {
        // Letra errada
        jogo.letrasErradas.push(input);
        jogo.tentativas--;
        
        // Verificar se perdeu
        if (jogo.tentativas === 0) {
          jogo.gameOver = true;
          document.getElementById("mensagem").innerText = `😭 Game Over! Palavra: ${jogo.palavra}`;
          document.getElementById("mensagem").classList.add("derrota");
        }
      }
      
      atualizarDisplay();
      document.getElementById("letraInput").value = "";
    }
    
    // Permitir chutar com Enter
    document.getElementById("letraInput").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        chutar();
      }
    });
    
    // Iniciar o jogo ao carregar a página
    novoJogo();
  </script>
</body>
</html>
